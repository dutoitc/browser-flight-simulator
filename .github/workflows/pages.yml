name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test flight model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Display Node.js version
        run: node --version
      - name: Run unit tests
        run: node --test
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/aircraft-renderer.js
          node --check src/aircrafts.js
          node --check src/destinations.js
          node --check src/flight-model.js
          node --check src/map-renderer.js
          node --check src/terrain-renderer.js

  deploy:
    name: Deploy static site
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
